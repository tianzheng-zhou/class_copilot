name: Check
on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: System audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2 pulseaudio-utils
      - run: uv sync --project backend --python 3.12 --frozen
      - run: npm ci --prefix web
      - name: Lint, unit tests, build
        run: ./scripts/check.sh
      - name: Generated API is up to date
        run: git diff --exit-code -- web/openapi.json web/src/api.generated.ts
      - name: Browser tests
        run: cd web && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: web/test-results
