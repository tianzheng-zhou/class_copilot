name: Check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2 pulseaudio-utils
      - run: uv sync --project backend --python 3.12 --frozen
      - run: npm ci --prefix web
      - run: ./scripts/check.sh
      - run: git diff --exit-code -- web/openapi.json web/src/api.generated.ts
      - run: cd web && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: web/test-results
